name: Build

on:
  pull_request:
    branches: [master]

# Only the latest commit of a PR is built: a newer push to the PR branch
# cancels any in-progress or queued run for the same pull request.
concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows MSVC
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Vulkan SDK shader tools
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          # Pin the SDK used by CI so shader compiler behavior is reproducible.
          # The SDK provides glslc, spirv-val, spirv-cross and dxc.
          version: 1.4.309.0
          cache: true

      - name: Verify shader tools
        shell: pwsh
        run: |
          foreach ($tool in @("glslc", "spirv-val", "spirv-cross", "dxc")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Required shader tool not found on PATH: $tool"
            }
          }

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DATOM_DXC_ROOT="$env:VULKAN_SDK"

      - name: Build
        run: cmake --build build --parallel

  linux:
    name: Linux GCC
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git make cmake ninja-build pkg-config \
            glslc spirv-tools \
            libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxtst-dev \
            libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libfribidi-dev libibus-1.0-dev libthai-dev \
            libudev-dev libusb-1.0-0-dev libwayland-dev \
            wayland-protocols libdecor-0-dev

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build --parallel
